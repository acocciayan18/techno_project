<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>TagBack</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Modes: 'system' (default) | 'light' | 'dark'. Only light/dark set the attr.
      try {
        var m = localStorage.getItem('qrlf-theme');
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
